# Configuración del servidor web de la API
server.port=8080

# Conexión dinámica a la Base de Datos usando las variables de entorno del contenedor
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:CHNAnalista2026!}

# Estrategia de Hibernate JPA (Crea y actualiza las tablas automáticamente al iniciar)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Muestra las consultas SQL que genera Spring en la consola para depurar errores
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.fail-on-empty-beans=false