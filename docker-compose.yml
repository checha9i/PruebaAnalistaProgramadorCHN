services:
  # Motor de Base de Datos (Transact-SQL)
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chn-sqlserver-container
    user: root
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CHNAnalista2026!"
      MSSQL_PID: "Developer"
      TZ: "America/Guatemala"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql/data
    healthcheck:
      test: [ "CMD", "bash", "-c", "</dev/tcp/127.0.0.1/1433" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  # API Backend (Spring Boot)
  backend:
    build: ./backend
    container_name: chn-spring-container
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=master;encrypt=true;trustServerCertificate=true;
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: CHNAnalista2026!
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.SQLServerDialect
      TZ: "America/Guatemala"
    depends_on:
      db:
        condition: service_healthy

  # Frontend (React)
  frontend:
    build: ./frontend
    container_name: chn-react-container
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  sqlserver_data: # Define el volumen relacional persistente
